# Contract for the Go service (implemented in backend/internal/handler).
# Regenerate the TypeScript types with: npm run gen:api
#
# AUTH: email and password (POST /api/auth/signup and /api/auth/login). The server
# sets a signed, HttpOnly session cookie, and routes marked "needs a user" read it.
openapi: 3.0.3
info:
  title: Cart Coach API
  version: 0.5.0
paths:
  /api/auth/signup:
    post:
      operationId: signUp
      summary: Create an account with an email and password, and sign in. Sets the HttpOnly session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, maxLength: 80 }
                email: { type: string, format: email }
                password: { type: string, minLength: 8, maxLength: 72 }
      responses:
        "201":
          description: The new user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { description: "Invalid name, email or password; the body has a plain-language `error`" }
        "409": { description: An account with this email already exists }
        "429": { description: Too many attempts }
  /api/auth/login:
    post:
      operationId: logIn
      summary: Log in with an email and password. Sets the HttpOnly session cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { description: The email and password don't match (the same answer whether or not the email exists) }
        "429": { description: Too many failed attempts; try again later }
  /api/auth/me:
    get:
      operationId: currentUser
      summary: The signed-in user (needs a session)
      responses:
        "200":
          description: The user
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { description: Not signed in }
  /api/auth/logout:
    post:
      operationId: signOut
      summary: End the session
      responses:
        "204": { description: Signed out }
  /api/products:
    get:
      operationId: listProducts
      summary: List catalog products (public)
      responses:
        "200":
          description: All products
          content:
            application/json:
              schema:
                type: object
                required: [products]
                properties:
                  products:
                    type: array
                    items: { $ref: "#/components/schemas/Product" }
  /api/profile:
    get:
      operationId: getProfile
      summary: The saved profile (needs a user)
      responses:
        "200":
          description: The profile with the user's original words
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedProfile" }
        "404": { description: No profile yet }
    put:
      operationId: saveProfile
      summary: Save the profile the user confirmed (needs a user)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SavedProfile" }
      responses:
        "200":
          description: The saved profile
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SavedProfile" }
        "400": { description: Invalid profile }
  /api/profile/understand:
    post:
      operationId: understandGoal
      summary: Turn the user's free-text goal into a profile with Gemini (needs a user). Saves nothing; the user reviews the result first.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text, age_years, weight_kg, height_cm]
              properties:
                text: { type: string, minLength: 8, maxLength: 500 }
                age_years: { type: integer, minimum: 18, maximum: 100 }
                weight_kg: { type: number, minimum: 30, maximum: 250 }
                height_cm: { type: number, minimum: 120, maximum: 230 }
      responses:
        "200":
          description: Either what Coach understood, or a supportive message when the text suggests distress (no targets or suggestions are given then)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UnderstandResponse" }
        "503": { description: Coach is not available }
  /api/profile/target:
    post:
      operationId: profileTarget
      summary: Work out the daily protein for these details and activity (needs a user). Saves nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [age_years, weight_kg, height_cm, activity]
              properties:
                age_years: { type: integer, minimum: 18, maximum: 100 }
                weight_kg: { type: number, minimum: 30, maximum: 250 }
                height_cm: { type: number, minimum: 120, maximum: 230 }
                activity: { $ref: "#/components/schemas/Activity" }
      responses:
        "200":
          description: The daily protein and a plain sentence that explains it
          content:
            application/json:
              schema:
                type: object
                required: [daily_protein_g, basis]
                properties:
                  daily_protein_g: { type: integer, minimum: 40, maximum: 220 }
                  basis: { type: string }
        "400": { description: "Invalid details; the body has a plain-language `error`" }
  /api/coach/suggest:
    post:
      operationId: suggestItems
      summary: Suggest cart additions (needs a user). Gemini chooses among eligible products; every number is checked against the catalog before it is returned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cart]
              properties:
                cart:
                  type: array
                  description: The user's own items only
                  items:
                    type: object
                    required: [product_id, quantity]
                    properties:
                      product_id: { type: integer }
                      quantity: { type: integer, minimum: 1, maximum: 50 }
                excluded_product_ids:
                  type: array
                  description: Suggestions the user already removed. Do not suggest these again.
                  items: { type: integer }
      responses:
        "200":
          description: Suggestions, possibly empty
          content:
            application/json:
              schema:
                type: object
                required: [suggestions, log]
                properties:
                  suggestions:
                    type: array
                    items: { $ref: "#/components/schemas/Suggestion" }
                  log: { $ref: "#/components/schemas/LogEntry" }
        "403": { description: Auto-add is off in this profile }
        "409": { description: The profile has no age, weight and height yet }
        "429": { description: Too many requests }
  /api/decisions:
    get:
      operationId: listDecisions
      summary: The user's decision log, newest first (needs a user)
      responses:
        "200":
          description: Log entries
          content:
            application/json:
              schema:
                type: object
                required: [decisions]
                properties:
                  decisions:
                    type: array
                    items: { $ref: "#/components/schemas/LogEntry" }
    post:
      operationId: addDecision
      summary: Record something the user did, such as keeping or removing a suggestion (needs a user)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogEntry" }
      responses:
        "204": { description: Saved }
components:
  schemas:
    User:
      type: object
      required: [id, email, name]
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
    Product:
      type: object
      required: [id, name, price, diet, allergens]
      properties:
        id: { type: integer }
        name: { type: string, description: "Includes brand and pack size, for example 'Kisan Fresh Masala Peanuts 150 g'" }
        brand: { type: string, nullable: true }
        category: { type: string, nullable: true }
        price: { type: number, description: Demo price in rupees }
        protein_g: { type: number, nullable: true, description: Per 100 g (or 100 ml) }
        calories: { type: integer, nullable: true, description: kcal per 100 g (or 100 ml) }
        image_url: { type: string, nullable: true }
        diet: { type: string, enum: [veg, egg, non-veg, unknown] }
        allergens:
          type: array
          description: "Tags such as peanuts, tree-nuts, dairy, egg, gluten, soy, fish, honey"
          items: { type: string }
    Diet:
      type: string
      enum: [veg, vegan, eggetarian, non-veg, unknown]
    Profile:
      type: object
      required: [protein_target_g, diet, allergies, likes, budget, auto_add, age_years, weight_kg, height_cm, activity, days, daily_protein_g]
      properties:
        protein_target_g: { type: integer, description: Protein for the whole cart, the daily amount times days. The server computes it and ignores a value sent by the browser. }
        diet: { $ref: "#/components/schemas/Diet" }
        allergies: { type: array, items: { type: string } }
        likes: { type: array, items: { type: string } }
        budget: { type: number, minimum: 50, maximum: 5000, description: Rupees for this cart }
        auto_add: { type: boolean, description: The user's consent to pre-fill the cart }
        age_years: { type: integer, nullable: true, description: Whole years, 18 to 100. Null on profiles saved before this field existed. }
        weight_kg: { type: number, nullable: true, description: 30 to 250. Null on older profiles. }
        height_cm: { type: number, nullable: true, description: 120 to 230. Null on older profiles. }
        activity: { type: string, description: "One of the Activity values, or an empty string on older profiles" }
        days: { type: integer, description: "Days the cart covers: 1, 3 or 7, or 0 on older profiles" }
        daily_protein_g: { type: integer, description: "Daily protein, 40 to 220, or 0 on older profiles" }
    Activity:
      type: string
      enum: [general, active, endurance, strength]
    SavedProfile:
      allOf:
        - $ref: "#/components/schemas/Profile"
        - type: object
          required: [goal_text, details_complete]
          properties:
            details_complete: { type: boolean, description: "False for profiles saved before the personal details existed; Coach stays paused until they are added" }
            goal_text: { type: string, minLength: 8, maxLength: 500, description: The user's own words, kept so they can retake them }
    Understanding:
      type: object
      required: [activity, diet, allergies, likes, daily_protein_g, basis]
      properties:
        activity: { $ref: "#/components/schemas/Activity" }
        diet: { $ref: "#/components/schemas/Diet" }
        allergies: { type: array, items: { type: string } }
        likes: { type: array, items: { type: string } }
        daily_protein_g: { type: integer, description: "Daily protein from the rule, or the amount the user stated" }
        basis: { type: string, description: A plain sentence that explains the daily amount }
    UnderstandResponse:
      type: object
      description: Exactly one of the two fields is set
      properties:
        understanding: { $ref: "#/components/schemas/Understanding" }
        support_message: { type: string }
    Suggestion:
      type: object
      required: [product_id, protein_g, price, reason]
      properties:
        product_id: { type: integer }
        protein_g: { type: number, description: Protein in the whole pack, from the catalog }
        price: { type: number, description: From the catalog }
        reason: { type: string, description: "One line shown on the cart item, built from the catalog numbers" }
        why: { type: string, description: Short plain-words reason written by the model, never contains digits }
    LogEntry:
      type: object
      required: [title, detail]
      properties:
        title: { type: string, maxLength: 200 }
        detail: { type: string, maxLength: 2000, description: Where each number came from }
        created_at: { type: string, format: date-time }
